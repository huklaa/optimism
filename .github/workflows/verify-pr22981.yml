name: Verify PR 22981 compatibility
on:
  push:
    branches: [ci-22981-20261011]
permissions:
  contents: read
jobs:
  dispute-monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f2b1a9bcf0aaa5cbf26ee51bd3d557aa6ceb5179
          persist-credentials: false
      - name: Set up Go from go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Install the repository-pinned yq
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/verify-bin"
          GOBIN="$RUNNER_TEMP/verify-bin" go install github.com/mikefarah/yq/v4@v4.44.5
          echo "$RUNNER_TEMP/verify-bin" >> "$GITHUB_PATH"
      - name: Build the pinned superchain bundle
        shell: bash
        run: |
          git submodule update --init --depth 1 -- superchain-registry
          bash op-core/superchain/sync-superchain.sh
      - name: Check changed-file formatting
        shell: bash
        run: |
          test -z "$(gofmt -l op-dispute-mon/mon/extract/super_agreement_enricher_test.go)"
      - name: Run focused tests on the PR head
        run: go test -count=1 ./op-dispute-mon/mon/extract ./op-dispute-mon/mon
      - name: Merge current develop locally for compatibility
        shell: bash
        run: |
          git fetch --no-tags --depth=150 https://github.com/ethereum-optimism/optimism.git 0e82422cd48d4610bf2ce67f8d376621f3c2602a
          git fetch --no-tags --deepen=150 origin fix-22909-dispute-mon-rollup-superroot
          git -c user.name='Compatibility check' -c user.email='noreply@example.invalid' merge --no-commit --no-ff 0e82422cd48d4610bf2ce67f8d376621f3c2602a
          git submodule update --init --depth 1 -- superchain-registry
          bash op-core/superchain/sync-superchain.sh
      - name: Run focused tests with current develop
        run: go test -count=1 ./op-dispute-mon/mon/extract ./op-dispute-mon/mon
